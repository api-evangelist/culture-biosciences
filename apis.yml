name: Culture Biosciences
description: >-
  Culture Biosciences is a South San Francisco TechBio company that builds
  cloud-connected bioreactor systems and bioprocess development services for
  cell culture. Its platform pairs automated single-use bioreactors (250mL
  bench-scale and 5L, plus the Stratyx mobile bioreactor) with Console, a
  cloud-native software product for real-time monitoring, experiment
  management, data analytics, and remote collaboration. Through its Nexxys
  services group the company runs clone/strain/construct screening, process
  characterization, process development, and bioprocess modeling and
  simulation for customers working on synthetic biology, protein therapeutics,
  and viral vectors. Culture Biosciences lets teams outsource and scale
  bioreactor experiments without scaling their own lab infrastructure. Backed
  by DCVC, Northpond Ventures, Synthesis Capital, S32, and Cultivian Sandbox
  Ventures. This profile is maintained in the API Evangelist network; the
  company operates the Console cloud platform but does not currently publish a
  public developer API, OpenAPI, SDKs, or developer documentation.
